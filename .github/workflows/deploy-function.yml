name: Deploy CrossTenantFunctionApp

on:
    push:
        branches:
            - main
        paths:
            - "AzureFunctionApp/CrossTenantFunctionApp/**"
            - ".github/workflows/deploy-function.yml"
    workflow_dispatch: {}

permissions:
    id-token: write
    contents: read

concurrency:
    group: deploy-function-app
    cancel-in-progress: false

jobs:
    build-and-deploy:
        name: Build and deploy
        # psf-build.ps1 bootstraps PSFramework.NuGet via a script that assumes a
        # Windows-style ";"-separated PSModulePath with a "Documents" folder entry,
        # so Save-PSFModule never becomes available on Linux runners.
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Azure login (OIDC)
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  enable-AzPSSession: true

            - name: Build and publish Function App
              shell: pwsh
              run: |
                  ./build/psf-build.ps1 `
                    -AppRg '${{ vars.AZURE_FUNCTIONAPP_RG }}' `
                    -AppName '${{ vars.AZURE_FUNCTIONAPP_NAME }}' `
                    -Restart
              working-directory: AzureFunctionApp/CrossTenantFunctionApp

            - name: Azure logout
              if: always()
              run: az logout
              continue-on-error: true
